[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-gpt-trace"
version = "0.2.0"
description = "Local, evidence-grounded VehicleGPT research prototype"
requires-python = ">=3.14,<3.15"
dependencies = [
  "PyYAML==6.0.3",
  "cantools==40.7.1",
  "fastapi==0.162.0",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "plotly==6.9.0",
  "pydantic==2.14.3",
  "python-can==4.6.1",
  "requests==2.34.2",
  "streamlit==1.67.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.170.15",
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]
